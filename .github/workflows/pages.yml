name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: landing
        run: npm ci
      - name: Validate and export
        working-directory: landing
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          npm run lint
          npm run test:qr
          npm run test:stories
          npm run build
          npm run typecheck
          npm run test:media
      - name: Exclude video masters from Pages artifact
        working-directory: landing
        run: node scripts/prune-pages-video-masters.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/out
      - uses: actions/upload-artifact@v4
        with:
          name: invitation-print-qr
          path: landing/print/qr
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
